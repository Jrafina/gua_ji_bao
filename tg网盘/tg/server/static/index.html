<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TG 存储池</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#fff; --line:#e6e8ec; --line2:#eef0f4;
    --txt:#1b1f24; --sub:#6b7280; --faint:#9aa2ae;
    --pri:#2f6fed; --pri-soft:#eef4ff; --ok:#16a34a; --ok-soft:#eefaf1;
    --warn:#b45309; --danger:#c0392b; --danger-soft:#fdf0ee;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       color:var(--txt);-webkit-font-smoothing:antialiased;background-color:#eef2f7;
       background-image:linear-gradient(rgba(236,242,249,.26),rgba(242,246,251,.60)),url("/static/background.jpg");
       background-position:center center,center center;background-size:cover,cover;
       background-repeat:no-repeat,no-repeat;background-attachment:fixed,fixed}
  .wrap{max-width:1040px;margin:0 auto;padding:26px 20px 80px}

  /* ---------- 顶栏 ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
       margin-bottom:18px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.72);
       border-radius:16px;padding:12px 16px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
  .brand{display:flex;align-items:center;gap:11px}
  .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#2f6fed,#5b9bff);
        display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(47,111,237,.28)}
  .logo svg{width:20px;height:20px;fill:#fff}
  h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
  .tagline{font-size:12px;color:var(--faint);margin-top:1px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:9px;padding:6px 11px;
        font-size:12px;color:var(--sub);box-shadow:var(--shadow)}
  .chip b{color:var(--txt);font-size:13px;font-weight:650;margin-left:2px}

  /* ---------- 面板 ---------- */
  .panel{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:14px;
         box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(6px)}
  .panel + .panel{margin-top:14px}

  /* ---------- 工具栏 ---------- */
  .bar{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
  .crumb{display:flex;align-items:center;gap:2px;flex:1;min-width:200px;flex-wrap:wrap;font-size:13px}
  .crumb a{color:var(--pri);text-decoration:none;cursor:pointer;padding:3px 6px;border-radius:6px;font-weight:520}
  .crumb a:hover{background:var(--pri-soft)}
  .crumb .cur{color:var(--txt);font-weight:650;padding:3px 6px}
  .crumb .sep{color:#c9cfd8;font-size:11px;user-select:none}
  .crumb.drop-hi{outline:2px dashed var(--pri);outline-offset:2px;border-radius:8px;background:var(--pri-soft)}

  .btn{border:1px solid var(--line);background:#fff;color:var(--txt);border-radius:9px;
       padding:7px 13px;cursor:pointer;font-size:13px;font-weight:550;white-space:nowrap;
       display:inline-flex;align-items:center;gap:6px;transition:.14s}
  .btn:hover{background:#f7f8fa;border-color:#d6dae0}
  .btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
  .btn.pri:hover{background:#2560d8;border-color:#2560d8}
  .btn.danger{color:var(--danger);border-color:#f0cdc7}
  .btn.danger:hover{background:var(--danger-soft);border-color:#e6b4ab}
  .btn svg{width:14px;height:14px;fill:currentColor;flex:none}
  .btn:disabled{opacity:.55;cursor:default;pointer-events:none}

  .search{position:relative;flex:none;width:210px}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;fill:#aab1bb}
  .search input{width:100%;padding:7px 11px 7px 30px;border:1px solid var(--line);border-radius:9px;
                font-size:13px;outline:none;font-family:inherit;color:var(--txt)}
  .search input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(47,111,237,.1)}
  .search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:16px;height:16px;
               border:none;background:#e5e8ec;color:#6b7280;border-radius:50%;cursor:pointer;
               font-size:11px;line-height:1;display:none;padding:0}
  .search input:not(:placeholder-shown) ~ .clr{display:block}

  /* ---------- 上传条 ---------- */
  .upbar{display:none;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line2);background:#fafbfd}
  .upbar.on{display:flex}
  .upbar .lbl{font-size:12px;color:var(--sub);white-space:nowrap;min-width:120px}
  .track{flex:1;height:7px;background:#e9edf3;border-radius:99px;overflow:hidden}
  .track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2f6fed,#5b9bff);
           border-radius:99px;transition:width .18s ease}
  .upbar .pct{font-size:12px;color:var(--txt);font-weight:600;min-width:42px;text-align:right}

  /* ---------- 列表 ---------- */
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th,td{text-align:left;padding:9px 14px;font-size:13px;vertical-align:middle}
  th{color:var(--faint);font-weight:600;font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;
     border-bottom:1px solid var(--line2);background:#fcfcfd}
  tbody tr{border-bottom:1px solid var(--line2);transition:background .12s}
  tbody tr:last-child{border-bottom:none}
  tbody tr:hover{background:#fbfcfd}
  td.nm{overflow:hidden}
  .name{display:flex;align-items:center;gap:9px;min-width:0}
  .name .ico{flex:none;width:17px;height:17px}
  .ico.dir{fill:#f5b942}
  .ico.file{fill:#b9c0cc}
  .name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .name .txt{font-weight:520;color:var(--txt);text-decoration:none;cursor:default}
  tr.dir .name .txt{cursor:pointer;font-weight:600;color:var(--txt)}
  tr.dir .name .txt:hover{color:var(--pri)}
  .path{font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
  .path.go{color:var(--pri);cursor:pointer}
  .path.go:hover{text-decoration:underline}
  mark{background:rgba(47,111,237,.16);color:inherit;border-radius:3px;padding:0 1px;font-weight:600}
  .sz,.dt{color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:12.5px}
  .op{display:flex;gap:5px;justify-content:flex-end}
  .op a,.op button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 10px;
        cursor:pointer;font-size:12px;text-decoration:none;color:var(--sub);white-space:nowrap;
        font-family:inherit;transition:.13s}
  .op a:hover{color:var(--ok);border-color:#bfe3c9;background:var(--ok-soft)}
  .op button:hover{color:var(--pri);border-color:#c3d6fb;background:var(--pri-soft)}
  .op button.rm:hover{color:var(--danger);border-color:#f2c7c0;background:var(--danger-soft)}
  tr[data-fid]{cursor:grab}
  tr.dragging{opacity:.4}
  tr.dir.drop-on td{background:var(--pri-soft);box-shadow:inset 0 0 0 2px rgba(47,111,237,.35)}
  .empty{text-align:center;color:var(--faint);padding:52px 20px;font-size:13px}
  .empty svg{width:38px;height:38px;fill:#dfe3e9;display:block;margin:0 auto 10px}
  .badge{font-size:11px;color:var(--faint);background:#f4f6f9;border-radius:5px;padding:0 6px;margin-left:2px}

  /* ---------- 拖拽遮罩 ---------- */
  .veil{position:fixed;inset:0;background:rgba(47,111,237,.07);backdrop-filter:blur(1px);
        display:none;align-items:center;justify-content:center;z-index:60;pointer-events:none}
  .veil.on{display:flex}
  .veil .box{background:#fff;border:2px dashed var(--pri);border-radius:16px;padding:30px 44px;text-align:center;
             box-shadow:0 12px 40px rgba(16,24,40,.14)}
  .veil .box svg{width:34px;height:34px;fill:var(--pri);margin-bottom:8px}
  .veil .box p{margin:0;font-weight:600;color:var(--pri);font-size:14px}

  /* ---------- 弹窗 ---------- */
  .mask{position:fixed;inset:0;background:rgba(15,20,28,.42);display:none;align-items:center;
        justify-content:center;z-index:80;padding:20px}
  .mask.on{display:flex}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:400px;box-shadow:0 18px 50px rgba(16,24,40,.22);
         animation:pop .16s ease-out;overflow:hidden}
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  .modal h3{margin:0;padding:16px 18px 4px;font-size:15px;font-weight:650}
  .modal .hint{padding:0 18px;color:var(--faint);font-size:12px}
  .modal .body{padding:14px 18px 6px}
  .modal input[type=text],.modal select{width:100%;padding:9px 11px;border:1px solid var(--line);
        border-radius:9px;font-size:13.5px;outline:none;font-family:inherit;color:var(--txt);background:#fff}
  .modal input[type=text]:focus,.modal select:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(47,111,237,.1)}
  .modal .foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px 16px}
  .warnbox{margin:14px 18px 6px;background:var(--danger-soft);border:1px solid #f6d5cf;border-radius:9px;
           padding:10px 12px;font-size:12.5px;color:#8d2f21;line-height:1.55}
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:#1f262e;color:#fff;
         padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;transition:.22s;z-index:100;pointer-events:none}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* ---------- 备份弹窗 ---------- */
  .bkrun{display:flex;align-items:center;gap:9px;color:var(--sub);font-size:13px}
  .dlbar{height:8px;border-radius:99px;background:#eef0f4;border:1px solid var(--line);overflow:hidden}
  .dlbar i{display:block;height:100%;width:0;background:var(--pri);border-radius:99px;transition:width .35s ease}
  .dlpct{display:flex;justify-content:space-between;margin-top:7px;font-size:12px;color:var(--faint)}
  .spin{width:14px;height:14px;border:2px solid #d8dde6;border-top-color:var(--pri);border-radius:50%;
        animation:sp .7s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  .bklist{border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .bkrow{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;font-size:12.5px;
         border-bottom:1px solid var(--line2)}
  .bkrow:last-child{border-bottom:none}
  .bkrow span{color:var(--faint);white-space:nowrap}
  .bkrow b{color:var(--txt);font-weight:600;text-align:right;word-break:break-all}
  .bkrow b.yes{color:var(--ok)}
  .bkrow b.no{color:var(--danger)}
  .bkerr{background:var(--danger-soft);border:1px solid #f6d5cf;border-radius:9px;padding:10px 12px;
         font-size:12.5px;color:#8d2f21;line-height:1.55}
  .bklog{margin:12px 18px 0;font-size:12px}
  .bklog summary{cursor:pointer;color:var(--pri);font-weight:550;padding:4px 0;outline:none}
  .bklog pre{max-height:190px;overflow:auto;background:#f6f8fb;border:1px solid var(--line);
             border-radius:8px;padding:9px 11px;margin:6px 0 0;font-size:11.5px;line-height:1.5;
             white-space:pre-wrap;word-break:break-all;color:var(--sub)}
  @media(max-width:720px){
    .wrap{padding:16px 12px 60px}
    .search{width:100%}
    .hide-sm{display:none}
    th,td{padding:9px 11px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24"><path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9V19a2 2 0 0 0 2 2h11a4 4 0 0 0 3-4.8z"/></svg></div>
      <div>
        <h1>TG 存储池</h1>
        <div class="tagline">Telegram 备份池 · 单文件 ≤ 2GB · 支持断点续传</div>
      </div>
    </div>
    <div class="chips">
      <div class="chip">文件夹 <b id="stFolders">-</b></div>
      <div class="chip">文件 <b id="stCount">-</b></div>
      <div class="chip">总容量 <b id="stBytes">-</b></div>
      <div class="chip" id="chipCache" style="cursor:pointer" title="服务器本地文件缓存，点击查看与清理">缓存 <b id="stCache">-</b></div>
    </div>
  </div>

  <div class="panel">
    <div class="bar">
      <nav class="crumb" id="crumb"></nav>
      <button class="btn pri" id="btnUp">
        <svg viewBox="0 0 24 24"><path d="M12 3l5 5h-3v7h-4V8H7z"/><path d="M5 19h14v2H5z"/></svg>上传文件
      </button>
      <button class="btn" id="btnMk">
        <svg viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M11 11h2v2h2v2h-2v2h-2v-2H9v-2h2z" fill="#fff"/></svg>新建文件夹
      </button>
      <button class="btn" id="btnBk" title="立即把索引打包备份（本地 + Telegram 各一份）">
        <svg viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6z"/><path d="M9.5 12l1.8 1.8L15 10"/></svg>备份索引
      </button>
      <button class="btn" id="btnCc" title="清理 bot API 在服务器本地留下的文件缓存">
        <svg viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6.5 7l1 13h9l1-13"/></svg>清理缓存
      </button>
      <div class="search">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
        <input id="q" placeholder="搜索文件名或路径…" autocomplete="off">
        <button class="clr" id="qClr" title="清空">✕</button>
      </div>
    </div>

    <div class="upbar" id="upbar">
      <div class="lbl" id="upLbl">准备上传…</div>
      <div class="track"><i id="upFill"></i></div>
      <div class="pct" id="upPct">0%</div>
    </div>

    <table>
      <thead>
        <tr>
          <th>名称</th>
          <th class="hide-sm" style="width:100px">大小</th>
          <th class="hide-sm" style="width:158px">时间</th>
          <th style="width:172px;text-align:right">操作</th>
        </tr>
      </thead>
      <tbody id="tb"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none"></div>
  </div>
</div>

<div class="veil" id="veil">
  <div class="box">
    <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5zM19 9h-4V3H9v6H5l7 7z"/></svg>
    <p id="veilTxt">松开以上传到当前文件夹</p>
  </div>
</div>

<div class="mask" id="mask">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="picker" multiple style="display:none">

<script>
/* ================= 基础 ================= */
const $ = id => document.getElementById(id);
const fmt = n => { if(n<1024) return n+" B"; const u=["KB","MB","GB","TB"]; let i=-1; do{n/=1024;i++}while(n>=1024&&i<u.length-1); return n.toFixed(n<10?1:0)+" "+u[i] };
const dt = t => new Date(t*1000).toLocaleString("zh-CN",{hour12:false,month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).replace(/\//g,"-");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ICO_DIR = '<svg class="ico dir" viewBox="0 0 24 24"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h3.6c.66 0 1.29.26 1.76.73L12 5.9h6.5A2.5 2.5 0 0 1 21 8.4v9.1a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg>';
const ICO_FILE = '<svg class="ico file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm2.5 13.5h-9v-1.5h9zm0-3.5h-9V10.5h9zm-3-5V3.5L18 7z"/></svg>';

let toastTimer;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("on"),2200); }

/* 弹窗 */
function openModal(html){ $("modal").innerHTML = html; $("mask").classList.add("on"); }
function closeModal(){ $("mask").classList.remove("on"); $("modal").innerHTML=""; }
$("mask").onclick = e => { if(e.target === $("mask")) closeModal(); };
document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });

/* ================= 状态 ================= */
let CUR = null;        // 当前文件夹 id
let TREE = [];         // 全部文件夹扁平树
let SEARCHING = false;
let TOKS = [];          /* 当前搜索关键词（分词后），用于命中高亮 */

/* ================= 数据加载 ================= */
async function loadStats(){
  try{
    const j = await (await fetch("/api/stats")).json();
    $("stFolders").textContent = j.folders ?? 0;
    $("stCount").textContent   = j.count ?? 0;
    $("stBytes").textContent   = fmt(j.bytes || 0);
  }catch(e){}
}
async function loadTree(){
  try{ TREE = (await (await fetch("/api/folders/tree")).json()).folders || []; }catch(e){ TREE = []; }
}
async function loadList(){
  const q = $("q").value.trim();
  SEARCHING = !!q;
  TOKS = SEARCHING ? q.split(/\s+/).filter(Boolean) : [];
  const url = SEARCHING ? "/api/list?q=" + encodeURIComponent(q)
                        : "/api/list" + (CUR !== null ? "?folder_id=" + CUR : "");
  const j = await (await fetch(url)).json();
  if(!SEARCHING) CUR = j.folder_id;
  renderCrumb(j);
  renderBody(j);
}
/* 关键词高亮：用 DOM 节点拼接（textContent），天然免疫 XSS 与实体转义问题 */
function hlFrag(s, toks){
  const frag = document.createDocumentFragment();
  const lows = (toks||[]).filter(Boolean).map(t=>t.toLowerCase());
  const low = s.toLowerCase();
  const spans = [];
  lows.forEach(t=>{ let i = 0;
    while((i = low.indexOf(t, i)) !== -1){ spans.push([i, i+t.length]); i += t.length; } });
  if(!spans.length){ frag.appendChild(document.createTextNode(s)); return frag; }
  spans.sort((a,b)=>a[0]-b[0] || b[1]-a[1]);
  const merged = [];
  for(const sp of spans){
    const last = merged[merged.length-1];
    if(last && sp[0] <= last[1]) last[1] = Math.max(last[1], sp[1]);
    else merged.push([...sp]);
  }
  let pos = 0;
  merged.forEach(([a,b])=>{
    if(a > pos) frag.appendChild(document.createTextNode(s.slice(pos, a)));
    const m = document.createElement("mark"); m.textContent = s.slice(a, b);
    frag.appendChild(m); pos = b;
  });
  if(pos < s.length) frag.appendChild(document.createTextNode(s.slice(pos)));
  return frag;
}
function renderCrumb(j){
  const c = $("crumb");
  if(SEARCHING){
    const n = j.total != null ? j.total : (j.files||[]).length;
    let h = '<span class="cur">搜索 “' + esc(j.search||"") + '”</span>';
    if(n) h += '<span class="sep">·</span><span style="color:var(--sub)">' + n + ' 个结果'
             + (j.total > n ? '（显示前 ' + n + '，可换更具体的关键词）' : '') + '</span>';
    c.innerHTML = h;
    return;
  }
  let h = '<a data-go="root">根目录</a>';
  (j.path||[]).forEach((p,i)=>{
    h += '<span class="sep">/</span>';
    h += (i === j.path.length-1)
      ? '<span class="cur">' + esc(p.name) + '</span>'
      : '<a data-go="' + p.id + '">' + esc(p.name) + '</a>';
  });
  c.innerHTML = h;
  c.querySelectorAll("a[data-go]").forEach(a=>{
    a.onclick = () => go(a.dataset.go === "root" ? null : Number(a.dataset.go));
  });
  c.ondragover = e => { e.preventDefault(); c.classList.add("drop-hi"); };
  c.ondragleave = () => c.classList.remove("drop-hi");
  c.ondrop = e => { e.preventDefault(); e.stopPropagation();
    c.classList.remove("drop-hi"); if(DRAG_ID !== null) moveFileTo(DRAG_ID, null); };
}
function renderBody(j){
  const tb = $("tb"); tb.innerHTML = "";
  const hasDir = j.folders && j.folders.length;
  const hasFile = j.files && j.files.length;
  $("empty").style.display = (hasDir || hasFile) ? "none" : "block";
  if(!hasDir && !hasFile){
    $("empty").innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h3.6c.66 0 1.29.26 1.76.73L12 5.9h6.5A2.5 2.5 0 0 1 21 8.4v9.1a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg>'
      + (SEARCHING ? "没有匹配的文件" : "这个文件夹是空的<br><span style='font-size:12px'>拖拽文件到此处即可上传</span>");
  }

  /* 文件夹行 */
  (j.folders||[]).forEach(f=>{
    const tr = document.createElement("tr");
    tr.className = "dir";
    tr.dataset.did = f.id;
    const sub = [];
    if(f.subfolders) sub.push(f.subfolders + " 个文件夹");
    sub.push(f.files + " 个文件");
    tr.innerHTML =
      `<td class="nm"><div class="name">${ICO_DIR}<div style="min-width:0"><span class="txt" title="${esc(f.name)}">${esc(f.name)}</span>
        <div class="path">${sub.join(" · ")}</div></div></div></td>
       <td class="sz hide-sm">—</td>
       <td class="dt hide-sm">${dt(f.created_at)}</td>
       <td><div class="op">
         <button class="mv">移动</button>
         <button class="rn">重命名</button>
         <button class="rm">删除</button>
       </div></td>`;
    const enter = () => go(f.id);
    tr.querySelector(".txt").onclick = enter;
    tr.querySelector(".mv").onclick = () => moveDialog({type:"folder", id:f.id, name:f.name});
    tr.querySelector(".rn").onclick = () => renameDialog(f);
    tr.querySelector(".rm").onclick  = () => deleteFolderDialog(f);
    /* 拖拽：把文件拖到文件夹上 = 移动进去 */
    tr.ondragover  = e => { if(DRAG_ID!==null){ e.preventDefault(); e.stopPropagation(); tr.classList.add("drop-on"); } };
    tr.ondragleave = () => tr.classList.remove("drop-on");
    tr.ondrop = e => { if(DRAG_ID!==null){ e.preventDefault(); e.stopPropagation();
      tr.classList.remove("drop-on"); moveFileTo(DRAG_ID, f.id); } };
    tb.appendChild(tr);
  });

  /* 文件行 */
  (j.files||[]).forEach(f=>{
    const tr = document.createElement("tr");
    tr.draggable = !SEARCHING;
    tr.dataset.fid = f.id;
    const hasP = f.path && f.path.length;
    const pth = hasP
      ? '<div class="path"' + (SEARCHING ? ' title="打开所在目录"' : '') + '></div>' : "";
    tr.innerHTML =
      `<td class="nm"><div class="name">${ICO_FILE}<div style="min-width:0"><span class="txt" title="${esc(f.name)}"></span>${pth}</div></div></td>
       <td class="sz hide-sm">${fmt(f.size)}</td>
       <td class="dt hide-sm">${dt(f.created_at)}</td>
       <td><div class="op">
         <a class="dl" href="/api/download/${f.id}" title="下载">下载</a>
         <button class="mv">移动</button>
         <button class="rm">删除</button>
       </div></td>`;
    const nameEl = tr.querySelector(".txt");
    if(SEARCHING) nameEl.appendChild(hlFrag(f.name, TOKS));
    else nameEl.textContent = f.name;
    const pEl = tr.querySelector(".path");
    if(pEl){
      const ps = f.path.map(p=>p.name).join(" / ");
      if(SEARCHING){
        pEl.classList.add("go");
        pEl.appendChild(hlFrag(ps, TOKS));
        pEl.onclick = () => go(f.folder_id == null ? null : f.folder_id);
      } else pEl.textContent = ps;
    }
    tr.querySelector(".dl").onclick = e => { e.preventDefault(); startDownload(f, e.currentTarget.href); };
    tr.querySelector(".mv").onclick = () => moveDialog({type:"file", id:f.id, name:f.name});
    tr.querySelector(".rm").onclick = () => deleteFileDialog(f);
    tr.ondragstart = e => { DRAG_ID = f.id; tr.classList.add("dragging");
      try{ e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain", f.id); }catch(_){} };
    tr.ondragend = () => { DRAG_ID = null; tr.classList.remove("dragging");
      document.querySelectorAll("tr.drop-on").forEach(x=>x.classList.remove("drop-on")); };
    tb.appendChild(tr);
  });
}
function go(id){
  if(id === CUR && !SEARCHING) return;
  CUR = id; $("q").value = ""; SEARCHING = false;
  loadList();
}

/* ================= 移动 ================= */
let DRAG_ID = null, PENDING = null;

function folderOptions(excludeId){
  const ex = excludeId != null ? new Set([excludeId, ...descendants(excludeId)]) : new Set();
  let h = '<option value="">根目录 /</option>';
  TREE.forEach(t=>{
    if(ex.has(t.id)) return;
    h += '<option value="'+t.id+'">' + "&nbsp;&nbsp;".repeat(t.depth) + (t.depth?"└ ":"") + esc(t.name) + '</option>';
  });
  return h;
}
function descendants(id){
  const out = []; const stack = [id];
  while(stack.length){
    const cur = stack.pop();
    TREE.filter(t=>t.parent_id === cur).forEach(t=>{ out.push(t.id); stack.push(t.id); });
  }
  return out;
}
function moveDialog(item){
  PENDING = item;
  const isDir = item.type === "folder";
  openModal(`<h3>移动${isDir?"文件夹":"文件"}</h3>
    <div class="hint">${esc(item.name)}</div>
    <div class="body"><select id="mSel">${folderOptions(isDir ? item.id : null)}</select></div>
    <div class="foot"><button class="btn" id="mNo">取消</button><button class="btn pri" id="mOk">移动</button></div>`);
  $("mOk").onclick = async () => {
    const v = $("mSel").value;
    const folder_id = v === "" ? null : Number(v);
    const url = isDir ? "/api/folders/"+item.id : "/api/files/"+item.id;
    const r = await fetch(url,{method:"PATCH",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({folder_id})});
    if(r.ok){ closeModal(); toast("已移动"); loadList(); loadTree(); }
    else { toast("失败：" + (await r.json()).detail); }
  };
  $("mNo").onclick = closeModal;
}

/* ================= 上传 ================= */
const picker = $("picker");
$("btnUp").onclick = () => picker.click();
picker.onchange = () => { uploadFiles(picker.files); picker.value = ""; };

async function uploadFiles(list){
  const files = [...list]; if(!files.length) return;
  const bar = $("upbar"); bar.classList.add("on");
  const fill = $("upFill"), pct = $("upPct"), lbl = $("upLbl");
  const target = CUR;                       // 上传到触发时的当前目录
  let idx = 0;

  for(const f of files){
    idx++;
    lbl.textContent = `(${idx}/${files.length}) ${f.name}`;
    fill.style.width = "0%"; pct.textContent = "0%";
    try{
      await new Promise((res, rej)=>{
        const fd = new FormData();
        fd.append("file", f);
        if(target !== null) fd.append("folder_id", target);
        const xhr = new XMLHttpRequest();
        xhr.open("POST","/api/upload");
        xhr.upload.onprogress = e => { if(e.lengthComputable){
          const p = e.loaded/e.total*100; fill.style.width = p.toFixed(1)+"%"; pct.textContent = p.toFixed(0)+"%"; } };
        xhr.onload = () => (xhr.status < 300) ? res() : rej(new Error(xhr.responseText || xhr.status));
        xhr.onerror = () => rej(new Error("网络错误"));
        xhr.send(fd);
      });
    }catch(err){
      let msg = err.message || "上传失败";
      try{ msg = JSON.parse(msg).detail || msg; }catch(_){}
      toast("上传失败：" + f.name + " — " + msg);
    }
  }
  fill.style.width = "100%"; pct.textContent = "100%";
  setTimeout(()=>{ bar.classList.remove("on"); fill.style.width = "0%"; }, 500);
  loadList(); loadStats();
}

/* 拖拽上传 */
let dragDepth = 0;
const veil = $("veil");
window.addEventListener("dragenter", e => {
  if(e.dataTransfer && [...(e.dataTransfer.types||[])].includes("Files")){
    dragDepth++; $("veilTxt").textContent = SEARCHING ? "松开以上传到根目录" : "松开以上传到当前文件夹";
    veil.classList.add("on");
  }
});
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("dragleave", e => { dragDepth = Math.max(0, dragDepth-1); if(!dragDepth) veil.classList.remove("on"); });
window.addEventListener("drop", e => {
  dragDepth = 0; veil.classList.remove("on");
  if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
    e.preventDefault();
    if(SEARCHING) CUR = null;
    $("q").value = ""; SEARCHING = false;
    uploadFiles(e.dataTransfer.files);
  }
});

function backupModal(j, err){
  let body = "";
  if(j && (j.bundle || j.size_kb != null)){
    const rows = [];
    if(j.bundle)   rows.push(`<div class="bkrow"><span>备份包</span><b>${esc(j.bundle)}</b></div>`);
    if(j.size_kb != null) rows.push(`<div class="bkrow"><span>大小</span><b>${j.size_kb.toFixed(1)} KB</b></div>`);
    if(j.files != null) rows.push(`<div class="bkrow"><span>内容</span><b>${j.folders} 个文件夹 · ${j.files} 个文件</b></div>`);
    rows.push(`<div class="bkrow"><span>服务器本地</span><b class="${j.local?'yes':'no'}">${j.local?'已保存':'未保存'}</b></div>`);
    rows.push(`<div class="bkrow"><span>Telegram 云端</span><b class="${j.remote?'yes':'no'}">${j.remote?'已上传':(j.local_only?'已跳过':'上传失败')}</b></div>`);
    body = `<div class="bklist">${rows.join("")}</div>`;
  }
  if(err) body = `<div class="bkerr"${body?' style="margin-bottom:12px"':''}>${esc(err)}</div>` + body;
  if(!body) body = `<div class="bkerr">未知错误</div>`;

  const log = (j && j.log) ? `<details class="bklog"><summary>查看脚本输出</summary><pre>${esc(j.log)}</pre></details>` : "";
  const title = err ? "备份失败" : ((j && j.ok) ? "备份完成" : "备份未完成");
  openModal(`<h3>${title}</h3>
    <div class="body">${body}</div>${log}
    <div class="foot"><button class="btn pri" id="mNo">知道了</button></div>`);
  $("mNo").onclick = closeModal;
}

/* ================= 服务器缓存 ================= */
function fmtAge(j){
  const L = [["lt_1d","24 小时内"],["1_7d","1-7 天"],["7_30d","7-30 天"],["gt_30d","30 天以上"]];
  const b = (j && j.buckets) || {};
  return L.filter(([k]) => b[k] && b[k].files)
          .map(([k,t]) => `<div class="bkrow"><span>${t}</span><b>${b[k].files} 个 · ${fmt(b[k].bytes)}</b></div>`).join("");
}

async function loadCache(){
  try{
    const j = await (await fetch("/api/cache")).json();
    $("stCache").textContent = j.files ? fmt(j.bytes || 0) : "0 B";
    $("stCache").style.color = (j.bytes > 5 * 1024 * 1024 * 1024) ? "var(--warn)" : "";
    return j;
  }catch(e){ $("stCache").textContent = "?"; return null; }
}

function cacheModal(j, err, freed){
  let body = "";
  if(j && j.files != null){
    const rows = [
      `<div class="bkrow"><span>缓存总量</span><b>${fmt(j.bytes || 0)}</b></div>`,
      `<div class="bkrow"><span>文件数</span><b>${j.files} 个</b></div>`,
      `<div class="bkrow"><span>存储池文件</span><b>不受影响</b></div>`,
    ];
    const ar = fmtAge(j);
    if(ar) rows.push(`<div class="bkrow" style="border-bottom:none;padding-bottom:2px"><span>缓存年龄分布</span><b></b></div>`, ar);
    body = `<div class="bklist">${rows.join("")}</div>`;
  }
  if(freed) body = `<div class="bkerr" style="background:var(--ok-soft);border-color:#bfe3c9;color:var(--ok)">已释放 ${fmt(freed.bytes)}（${freed.count} 个文件）</div>` + body;
  if(err)   body = `<div class="bkerr"${body?' style="margin-bottom:12px"':''}>${esc(err)}</div>` + body;
  if(!body) body = `<div class="bkerr">未知错误</div>`;

  openModal(`<h3>服务器本地缓存</h3>
    <div class="hint">下载过的文件会在服务器本地留一份副本，方便下次秒开。清理它<b>不影响</b>存储池里的文件，只是下次下载要重新从 Telegram 拉取（受服务器带宽限制，会慢一些）。</div>
    <div class="body">${body}</div>
    <div class="foot">
      <button class="btn" id="mClose">关闭</button>
      <button class="btn" id="mD30">清理 30 天前的</button>
      <button class="btn danger" id="mAll">全部清空</button>
    </div>`);
  $("mClose").onclick = closeModal;
  $("mD30").onclick = () => runClean("days", {days: 30});
  $("mAll").onclick = confirmAll;
}

function confirmAll(){
  const c = ($("stCache").textContent || "").trim();
  openModal(`<h3>确认清空全部缓存？</h3>
    <div class="hint">当前缓存 ${esc(c)}。清空后所有文件下次下载都要从 Telegram 重新拉取。<br>
      <b>存储池里的文件不会被删除</b>，只是短期内下载会变慢。</div>
    <div class="foot">
      <button class="btn" id="mNo">取消</button>
      <button class="btn danger" id="mYes">确认清空</button>
    </div>`);
  $("mNo").onclick = () => cacheModal(CACHE, null, null);
  $("mYes").onclick = () => runClean("all", {});
}

let CACHE = null;

async function runClean(mode, params){
  const q = new URLSearchParams(Object.assign({mode}, params)).toString();
  openModal(`<h3>正在清理缓存</h3>
    <div class="body"><div class="bkrun"><span class="spin"></span>正在删除，请稍候…</div></div>`);
  let j = null, err = null;
  try{
    const r = await fetch("/api/cache/clean?" + q, {method: "POST"});
    j = await r.json().catch(() => ({}));
    if(!r.ok) err = j.detail || ("HTTP " + r.status);
  }catch(e){ err = e.message || "网络错误"; }
  if(err){ cacheModal(null, err, null); return; }
  CACHE = await loadCache();
  const freed = j.removed_files ? {bytes: j.freed_bytes, count: j.removed_files} : null;
  cacheModal(CACHE, null, freed);
  if(freed) toast("已释放 " + fmt(freed.bytes));
  else toast("没有需要清理的缓存");
}

$("btnCc").onclick = async () => {
  CACHE = await loadCache();
  cacheModal(CACHE, null, null);
};
$("chipCache").onclick = $("btnCc").onclick;

/* ================= 下载（先预热、显示真实进度） =================
   bot API 的 getFile 必须先把整份文件落到服务器本地才返回路径，所以首次下载
   会有很长一段"浏览器收不到任何字节"的等待。这里把它做成看得见的进度条。 */
let DL_TOKEN = 0, DL_TIMER = null;

function stopDl(){ if(DL_TIMER){ clearTimeout(DL_TIMER); DL_TIMER = null; } }

function fmtTime(s){
  s = Math.max(0, Math.round(s || 0));
  if(s < 60) return s + " 秒";
  const m = Math.floor(s / 60), r = s % 60;
  if(m < 60) return m + " 分" + (r ? " " + r + " 秒" : "");
  return Math.floor(m / 60) + " 时 " + (m % 60) + " 分";
}

function dlOpen(f){
  openModal(`<h3 id="dlTitle">正在从 Telegram 拉取文件</h3>
    <div class="hint" id="dlHint">Bot API 的机制决定：必须整份文件先落到服务器本地，才能开始向浏览器传输，
      所以首次下载会先等这一段。拉取完成后会自动开始下载，<b>之后下载同一文件秒开</b>。</div>
    <div class="body">
      <div class="dlbar"><i id="dlBar"></i></div>
      <div class="dlpct"><span id="dlPct">0.0%</span><span id="dlTime"></span></div>
      <div class="bklist" style="margin-top:12px">
        <div class="bkrow"><span>文件</span><b id="dlName"></b></div>
        <div class="bkrow"><span>大小</span><b id="dlSize"></b></div>
        <div class="bkrow"><span>已拉取</span><b id="dlGot"></b></div>
        <div class="bkrow"><span>速度</span><b id="dlSpd"></b></div>
        <div class="bkrow"><span>预计剩余</span><b id="dlEta"></b></div>
      </div>
    </div>
    <div class="foot"><button class="btn" id="mNo">关闭（继续后台拉取）</button></div>`);
  $("dlName").textContent = f.name;
  $("dlName").title = f.name;
  $("dlSize").textContent = fmt(f.size || 0);
  $("mNo").onclick = () => {
    stopDl(); DL_TOKEN++;
    closeModal();
    toast("仍在后台拉取，稍后再点「下载」即可秒开");
  };
}

function dlUpdate(st){
  if(!$("dlBar")) return;
  const pct = (st.state === "ready") ? 100 : (st.percent || 0);
  $("dlBar").style.width = pct.toFixed(1) + "%";
  $("dlPct").textContent = pct.toFixed(1) + "%";
  $("dlTime").textContent = st.elapsed ? "已用 " + fmtTime(st.elapsed) : "";
  $("dlGot").textContent = fmt(st.bytes || 0) + " / " + fmt(st.total || 0);
  $("dlSpd").textContent = st.speed ? fmt(st.speed) + "/s" : "—";
  $("dlEta").textContent = (st.state === "ready") ? "已就绪"
    : (st.eta != null ? fmtTime(st.eta) : "计算中…");
  if(st.state === "ready"){
    $("dlTitle").textContent = "准备完成，开始下载";
    $("dlHint").innerHTML = "文件已在服务器缓存，下载即将开始。";
    $("dlBar").style.background = "var(--ok)";
  }
}

async function startDownload(f, url){
  stopDl();
  const token = ++DL_TOKEN;
  dlOpen(f);
  dlUpdate({state: "preparing", percent: 0, bytes: 0, total: f.size, eta: null, elapsed: 0});
  let st = null;
  try{
    const r = await fetch("/api/download/" + f.id + "/prepare", {method: "POST"});
    st = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error((st && st.detail) || ("HTTP " + r.status));
  }catch(e){
    if(token === DL_TOKEN){ stopDl(); closeModal(); toast("准备失败：" + (e.message || "网络错误")); }
    return;
  }
  if(token !== DL_TOKEN) return;
  dlStep(f, url, st, token);
}

function dlStep(f, url, st, token){
  if(token !== DL_TOKEN) return;
  dlUpdate(st);
  if(st.state === "ready"){
    stopDl();
    setTimeout(() => { if(token === DL_TOKEN){ closeModal(); window.location.href = url; } }, 400);
    return;
  }
  if(st.state === "failed"){
    stopDl();
    toast("拉取失败：" + (st.error || "未知错误"));
    return;
  }
  DL_TIMER = setTimeout(async () => {
    let j = st;
    try{
      const r = await fetch("/api/download/" + f.id + "/progress");
      const d = await r.json();
      if(r.ok) j = d;
    }catch(_){}
    dlStep(f, url, j, token);
  }, 700);
}

loadStats(); loadTree(); loadList(); loadCache();
